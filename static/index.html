<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Stargaze</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="sky"></canvas>

  <div id="tooltip" class="tooltip hidden"></div>

  <div id="status" class="status"></div>

  <div id="compass" class="compass"></div>

  <button id="panel-toggle" class="panel-toggle" aria-label="Toggle controls">&#9776;</button>

  <div id="panel" class="panel">
    <div class="panel-row">
      <label for="lat">Latitude</label>
      <input id="lat" type="number" step="0.0001" min="-90" max="90" placeholder="51.4769" />
    </div>
    <div class="panel-row">
      <label for="lon">Longitude</label>
      <input id="lon" type="number" step="0.0001" min="-180" max="180" placeholder="0.0" />
    </div>
    <div class="panel-row">
      <button id="use-location">Use my location</button>
      <button id="apply-location">Apply</button>
    </div>

    <div class="panel-row">
      <label for="time-slider">Time (relative to now)</label>
      <input id="time-slider" type="range" min="-360" max="720" step="5" value="0" />
      <span id="time-label"></span>
    </div>
    <div class="panel-row">
      <button id="now-button">Now</button>
    </div>

    <div class="panel-row">
      <label for="mag-limit">Faintest stars (mag &le; <span id="mag-limit-label">6.0</span>)</label>
      <input id="mag-limit" type="range" min="2" max="8" step="0.5" value="6" />
    </div>
    <div class="panel-row">
      <label><input id="toggle-constellations" type="checkbox" checked /> Constellation lines</label>
    </div>
    <div class="panel-row">
      <label><input id="toggle-labels" type="checkbox" checked /> Labels</label>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
